# ===========================================================================
# 附魔战争 (FMWar) 配置
#
# 所有坐标、装备、时间、shopId 均可修改，改完执行 /fmwar reload 生效。
# 坐标写法：
#   单点  -> [x, y, z] 或 { x: 1, y: 2, z: 3 }（可再加 facing: {x,y,z} 指定朝向点）
#   区域  -> min: [x,y,z] / max: [x,y,z]，加载时自动取小值为 min、大值为 max，
#            因此不必关心两个角点的先后顺序。
# 提示文案支持 & 颜色代码与 {player} / {prefix} 占位符。
# ===========================================================================

config-version: 1

# 全局消息前缀。{prefix} 用于「加入/退出队列」这类玩家动向提示，颜色保持不变
prefix: '&6[附魔战争]&r '

# 玩法提示前缀：{war_prefix} 用于其余全部提示，颜色为 light_purple
war-prefix: '&d[附魔战争]&r '

# ===========================================================================
# 区域与传送点
#
# world 必须与服务器上游戏世界的实际名字完全一致。本插件所有区域、传送点、
# 按钮、奖励箱都只在这一个世界里生效 —— 世界名不一致时全部判定都会静默失效
# （点按钮没反应、进场地被判离场、传送失效），因此加载期会校验并明确报错。
#
# 各区域/坐标点也支持单独写 world: 覆盖本项，但只应在确有跨世界需求时使用；
# 与顶层 world 不一致会在控制台与 /fmwar doctor 里被报出来。
# ===========================================================================
world: game

regions:
  # 游戏场地（正式对局范围）
  arena:
    min: [-1354, 39, -2041]
    max: [-894, 300, -1389]
  # 提示接收范围（比场地略大，只有范围内的玩家能看到游戏提示）
  notify:
    min: [-1354, 39, -2041]
    max: [-857, 320, -1389]
  # 准备房间
  prep-room:
    min: [-893, 94, -1734]
    max: [-876, 140, -1688]
  # 大厅
  hall:
    min: [-890, 102, -1715]
    max: [-879, 130, -1707]
  # 决斗圈 1
  duel-1:
    min: [-1354, 94, -1693]
    max: [-1266, 172, -1786]

locations:
  # 场地传送点（观战入场点）；facing 指定朝向点
  arena-spawn:
    point: [-1157, 101, -1823]
    facing: [-1157, 101, -1822]
  # 准备房间传送点
  prep-spawn:
    point: [-882, 95, -1711]
    facing: [-883, 95, -1711]
  # 大厅传送点
  hall-spawn:
    point: [-887, 102, -1711]
    facing: [-886, 102, -1711]

# ===========================================================================
# 按钮（右键触发）
#
# 每个按钮支持两种写法，判定时先做精确方块匹配，再按 radius 容错：
#   block:  [x, y, z]                        # 单方块
#   blocks: [[x,y,z], [x,y,z], ...]          # 多方块（同一动作放了多个按钮时用）
# radius 是容错半径（格），默认 2.0：按钮贴墙/贴地时，被点中的那一格经常
# 与预期坐标差一格，2.0 能吃掉这种误差而不会误判到隔壁的另一个按钮。
# 游戏内校准：/fmwar button          列出按钮与当前坐标
#             /fmwar button join     然后右键一次目标方块，即把它登记为该按钮
# ===========================================================================
buttons:
  # 大厅：加入游戏
  join:
    block: [-880, 103, -1711]
    radius: 2.0
  # 准备房间：准备按钮，连续右键 clicks 次开始
  prepare:
    block: [-886, 96, -1711]
    radius: 2.0
  # 准备房间：返回大厅
  back-to-hall:
    block: [-879, 96, -1711]
    radius: 2.0
  # 大厅：观战
  spectator:
    block: [-881, 103, -1708]
    radius: 2.0

# ===========================================================================
# 时间（秒）
# ===========================================================================
timing:
  # 准备按钮需要连续右键的次数
  prepare-clicks: 7
  # 准备倒计时（准备按钮达成后开始）
  prepare-countdown: 10
  # 对局总时长；倒计时归零后场地内玩家每秒扣血
  game-duration: 900
  # 剩余多少秒时把场内玩家传送到决斗圈
  duel-teleport-at: 60
  # 每多少秒发放一颗绿宝石
  emerald-interval: 30
  # 倒计时归零后的每秒扣血量
  overtime-damage: 2

# ===========================================================================
# 开局分散（围绕场地中心点）
#
# center 是标准的 [x, y, z] 坐标：x = -1078、z = -1774 是场地中心。
# y 是分散搜索的起始高度，**可省略**——省略时会自动取玩家的当前高度作为参考，
# 因此 y 不影响分散是否生效，只在“最高可落脚点”的搜索起点上略作影响。
# 写成 [-1078, 120, -1774] 也可以。
#
# 分散范围是以该中心为心的**正方形**，half-size 为半径（格）。
# 落点会被强制约束在 regions.arena 之内，越界落点直接丢弃。
# ===========================================================================
disperse:
  enabled: true
  center: [-1078, 120, -1774]
  radius: 100
  min-spacing: 25
  max-attempts: 600

# ===========================================================================
# 决斗圈传送
#
# center 同样是标准 [x, y, z]；y 可省略。落点同样被约束在 regions.arena 之内。
# ===========================================================================
duel:
  center: [-1311, 120, -1740]
  radius: 40
  # 决斗圈落点之间的最小间距（格）。设为 0 表示不限制。
  min-spacing: 5
  max-attempts: 300

# ===========================================================================
# 开局给予效果（对局开始时执行一次）
# ===========================================================================
start:
  # 开局清空背包（需求：游戏内物品不能带出场地）。
  # 刻意**不做背包备份**：备份只存在内存里，崩服会连同备份一起丢失，
  # 反而让玩家的物品不安全。需要保护玩家物品请用专门的背包备份插件。
  clear-inventory: true
  clear-effects: true
  # 是否在提示接收范围内一并禁止潜行。
  # 默认 false：需求里的“坐下/躺下/趴下”由坐姿插件提供，原版只有潜行可拦，容易误伤。
  block-sneak: false
  # 奖励箱只产出附魔书（enchanted_book），不直接给武器装备。
  # 打开后 chests.loot-groups 里的材质名只作标签，不再需要是合法材质。
  loot-books-only: true
  # 抗性提升（tick）
  resistance:
    enabled: true
    duration-ticks: 100
    amplifier: 4
  # 回满血量与饱食度
  heal: true
  # 发放钓鱼竿
  fishing-rod:
    enabled: true
    material: FISHING_ROD
    # 附魔写法："<完整命名空间键>=<等级>"，列表形式避免 YAML 把冒号当键值分隔
    enchantments:
      - 'minecraft:lure=255'
      - 'minecraft:luck_of_the_sea=255'
      - 'minecraft:magic_detection=5'

# ===========================================================================
# 游戏中每 interval 秒发放绿宝石
# ===========================================================================
emerald:
  amount: 1

# ===========================================================================
# 奖励箱
#
# chests          : 箱子生成的坐标（配置化）
# loot-groups     : 每个箱子从这些行中随机取一行，只放这一行的物品
# 物品写法         : "<材质>[:[命名空间:]附魔键=等级[,...]]"
# 附魔键缺省命名空间为 minecraft。解析失败的条目会写日志并被跳过。
# ===========================================================================
chests:
  # 奖励箱生成的坐标
  locations:
    - [-1170, 84, -1964]
    - [-1034, 69, -1928]
    - [-1015, 80, -1814]
    - [-961, 88, -1746]
    - [-1219, 99, -1785]
    - [-1132, 163, -1574]
  loot-groups:
    - - 'NETHERITE_SWORD:overlay_network=6'
    - - 'NETHERITE_AXE:blood_roar=7'
    - - 'MACE:doom_hammer=1,wind_burst=1'
    - - 'MACE:union=1'
      - 'NETHERITE_HOE:union=1'
    - - 'TRIDENT:daedalus=1,loyalty=3'
    - - 'TRIDENT:faith=1,lunge=5'
    - - 'CROSSBOW:fusion_strike=1'
    - - 'BOW:eternal=1'
      - 'TIPPED_ARROW:potion=instant_damage;amplifier=1'
    - - 'NETHERITE_HELMET:evil_frenzy=1'
      - 'FISHING_ROD:magnetic_link=1,beach_boy=2'
    - - 'NETHERITE_CHESTPLATE:fortitude=1'

# ===========================================================================
# ExtraShop 集成：对局开始时 spawn、结束时 despawn 的商店 id
# 这些商店必须已在服务器上用 /eshop 预先定义并摆放在场地内。
# ===========================================================================
extra-shops:
  enabled: true
  ids: [fmcm1, fmcm2, fmcm3, fmcm4, fmcm5, fmcm6]

# ===========================================================================
# 领地（Residence）权限联动
#
# 准备房间与场地的领地在服务器上常态关闭传送权限，普通玩家进不去。
# 本插件只在**真正需要**时临时打开、用完立刻恢复：
#   - 有人进入队列 → 打开 prep-regions
#   - 队列清空（对局开始 / 全部退出）→ 恢复 prep-regions
#   - 对局开始 → 打开 arena-regions（开局分散、传决斗圈、观战进场都在这段时间内）
#   - 对局结束 → 恢复 arena-regions
#
# flag 默认用 move：它才是“能不能进出这片领地”的实际生效项
#（tp 只约束领地自身的 /res tp 指令，对插件传送无效）。
# 本插件按插件名检测 Residence，未安装时整段自动跳过。
# ===========================================================================
residence:
  enabled: true
  flag: move
  # 排队期间需要放行的领地
  prep-regions: [FM.zb]
  # 对局期间需要放行的领地
  arena-regions: [FM]

# ===========================================================================
# 队伍名（Bukkit 计分板队伍）与记分板
# ===========================================================================
teams:
  player: fm
  spectator: fmgz

scoreboard:
  enabled: true
  title: '&6附魔战争'
  # 剩余时间：默认直接写秒数（900 → 899 → …）；改成 false 则写 mm:ss
  time-seconds: true
  time-line: '&e剩余时间 &f{time}'
  alive-line: '&e存活人数 &f{alive}'
  # 积分榜：使用服务器上名为 <main> 的记分板（默认 fmjfb）
  points-enabled: true
  points-main: fmjfb
  points-title: '&6附魔战争积分榜'
  points-header: '&e玩家 &7| &e积分'
  # 每行一个名次；{rank} 名次、{player} 玩家名、{points} 积分
  points-line: '&f{rank}. &a{player} &7- &e{points}'
  # 最多显示多少行
  points-rows: 10

# ===========================================================================
# 提示文案（{player} 会被替换为玩家名，不含前缀部分请自行加 {prefix}）
# ===========================================================================
messages:
  # 是否把高频状态提示同时发到动作栏（true 时聊天栏只保留关键事件）
  actionbar: true
  queue-join: '{prefix}&a{player} &7加入游戏队列'
  queue-leave: '{prefix}&c{player} &7退出游戏队列'
  queue-joined-self: '{prefix}&a你已加入游戏队列，请在准备房间内等待'
  queue-left-self: '{prefix}&7你已退出游戏队列'
  queue-already-joined: '{prefix}&7你已经在游戏队列中，无需重复点击'
  spectator-already: '{prefix}&7你已经在观战模式中'
  # 准备进度也常驻显示在屏幕上方（BossBar），格式 {clicks}/{required}
  prepare-progress-bar: '{war_prefix}&e准备进度 &f{clicks}&7/&f{required}&e（由队伍成员共同累计）'
  prepare-progress: '{prefix}&e准备中 &f{clicks}&7/&f{required}'
  # 倒计时常驻显示条（屏幕上方 BossBar，只发给队列内的玩家）
  prepare-countdown-bar: '{war_prefix}&e游戏将在 &f{seconds} &e秒后开始'
  # 倒计时期间人数不足两人时的取消提示
  prepare-cancel-not-enough: '{war_prefix}&c准备房间内已入队人数不足两人，准备进度已重置，请重新点满准备按钮'
  # 倒计时期间有新玩家加入队列时的取消提示
  prepare-cancel-joined: '{war_prefix}&e有玩家加入队列，倒计时已取消，准备进度重新累计'
  prepare-need-two: '{prefix}&c准备房间内至少需要两名已入队玩家'
  prepare-announce: '{war_prefix}&a准备完成，&f{seconds} &a秒后开始游戏'
  prepare-reset: '{prefix}&c有玩家进入准备房间，准备进度已重置'
  prepare-countdown: '{prefix}&e游戏将在 &f{seconds} &e秒后开始'
  duel-teleport: '{prefix}&c剩余时间不足，已把你传送到决斗圈'
  game-start: '{prefix}&a游戏开始！'
  game-already-running: '{prefix}&c游戏已经开始，暂时无法加入'
  spectator-unavailable: '{prefix}&c当前没有进行中的对局，无法观战'
  spectator-only-in-game: '{prefix}&c你正在游戏中，无法观战'
  spectator-enter: '{prefix}&7你已进入观战模式'
  arena-forbidden: '{prefix}&c对局进行中，无关玩家不能进入场地'
  action-blocked: '{prefix}&c该动作在游戏场地范围内不允许'
  spectator-arena-exit: '{prefix}&7你已离开场地范围'
  player-arena-exit: '{prefix}&c{player} &7离开了游戏'
  death: '{prefix}&c{player} &7死亡'
  quit: '{prefix}&c{player} &7离开了游戏'
  win: '{prefix}&6{player} &e获得胜利，游戏结束'
  no-survivor: '{prefix}&7无人生还，游戏结束'
  game-over: '{prefix}&7游戏结束'
  reload-ok: '{prefix}&a配置已重新加载'
  reload-failed: '{prefix}&c配置加载失败，请查看控制台日志'
  no-permission: '{prefix}&c你没有权限执行该操作'
  # ---- 指令回显（{label} 为指令别名，来自 plugin.yml 的 aliases）----
  command-usage-title: '{prefix}&6附魔战争指令：'
  command-usage-reload: '&e/{label} reload &7- 重新加载 config.yml'
  command-usage-start: '&e/{label} start &7- 立即开始一局（跳过准备按钮）'
  command-usage-stop: '&e/{label} stop &7- 强制中止当前对局并清场'
  command-usage-status: '&e/{label} status &7- 查看当前状态'
  command-usage-doctor: '&e/{label} doctor &7- 自检配置与 ExtraShop 集成'
  command-usage-button: '&e/{label} button &7- 列出按钮坐标，或进入游戏内校准'
  command-usage-points: '&e/{label} points &7- 查看与管理积分榜（击杀 +1，获胜 +3）'
  command-usage-debug: '&e/{label} debug &7- 开关准备/队列链路的详细日志（排查按钮与倒计时问题）'
  command-usage-time: '&e/{label} time <秒数> &7- 修改当前对局的剩余时间（测试用）'
  command-usage-chest: '&e/{label} chest &7- 读回当前奖励箱的实际内容（排查箱子为空）'
  chest-title: '{war_prefix}&6奖励箱内容（共 &f{count} &6个）：'
  chest-none: '{war_prefix}&7当前没有生成任何奖励箱（对局未开始，或 chests 未配置）'
  chest-line: '&7{coords} &7- &e{count} &7件：&f{items}'
  chest-empty: '&7{coords} &7- &c空'
  chest-not-chest: '&7{coords} &7- &c该坐标已不是箱子方块'
  time-usage: '{war_prefix}&c用法：/fmwar time <秒数>（例如 /fmwar time 60）'
  time-set: '{war_prefix}&a已把剩余时间修改为 &f{seconds} &a秒'
  time-no-game: '{war_prefix}&c当前没有进行中的对局，无法修改剩余时间'
  debug-on: '{war_prefix}&a已开启调试日志：准备按钮、队列进出、倒计时都会打印到控制台，再执行一次可关闭'
  debug-off: '{war_prefix}&7已关闭调试日志'
  # ---- 积分榜 ----
  points-list-title: '{war_prefix}&6附魔战争积分榜（共 &f{count} &6人，第 &f{page}&6/&f{pages} &6页）：'
  points-line: '&7{rank}. &a{player} &7- &e{points} &7分'
  points-empty: '{war_prefix}&7暂无积分记录'
  points-page-hint: '{war_prefix}&7翻页：&f/fmwar points list {next} &7（共 &f{pages} &7页；也可直接 &f/fmwar points list <页码>&7）'
  points-usage-title: '{war_prefix}&6积分榜指令：'
  points-usage-list: '&e/fmwar points [list <页码>] &7- 查看积分榜（每页最多 10 条）'
  points-usage-set: '&e/fmwar points set <玩家> <分值> &7- 设为指定分值（0 表示删除）'
  points-usage-add: '&e/fmwar points add <玩家> <增量> &7- 加减分（增量可为负）'
  points-usage-remove: '&e/fmwar points remove <玩家> &7- 删除该玩家的积分记录'
  points-usage-reset: '&e/fmwar points reset &7- 清空全部积分'
  points-usage-note: '&7玩家名可以是在线玩家，也可以是曾参与过对局的玩家；每页最多 10 条'
  points-updated: '{war_prefix}&a已将 &f{player} &a的积分设为 &f{points}'
  points-removed: '{war_prefix}&a已删除 &f{player} &a的积分记录'
  points-reset: '{war_prefix}&a已清空全部积分（共 &f{count} &a条）'
  points-need-player: '{war_prefix}&c请在指令里写明玩家名'
  points-unknown-player: '{war_prefix}&c找不到玩家 &f{player} &c（需要在线，或曾参与过对局）'
  points-not-found: '{war_prefix}&7玩家 &f{player} &7本来就没有积分记录'
  # ---- 按钮校准 ----
  button-capture-choose: '{prefix}&e请点击下面一个按钮名，然后右键一次目标方块完成校准：'
  button-capture-prompt: '{prefix}&e请在 &f{seconds} &e秒内右键一次目标方块，把它登记为按钮 &f{button}'
  button-capture-done: '{prefix}&a已将 &f{world} {x} {y} {z}&a 上的 &f{material} &a登记为按钮 &f{button}&a，配置已保存并生效'
  button-capture-failed: '{prefix}&c登记按钮 &f{button} &c失败：按钮名不存在或配置文件写入失败（详见控制台日志）'
  button-list-title: '{prefix}&6当前按钮坐标（共 &f{count} &6个，容错半径 &f{radius} &6格）：'
  button-list-line: '&7 - &f{button}&7: &f{blocks}'
  button-list-none: '&7未配置任何坐标'
  button-near-none: '{prefix}&7你右键的方块不属于任何已配置按钮'
  command-reload-ok: '{prefix}&a配置已重新加载'
  command-reload-problems: '{prefix}&c配置存在 &f{count} &c个问题，已保留上一份可用配置：'
  command-start-running: '{prefix}&c当前已有进行中的对局'
  command-start-need-two: '{prefix}&c准备房间内至少需要两名已入队玩家，当前 &f{count} &c名'
  command-start-ok: '{prefix}&a已强制开始对局，参战 &f{count} &a名玩家'
  command-stop-idle: '{prefix}&7当前没有进行中的对局'
  command-stop-ok: '{prefix}&a已中止对局，正在清场'
  status-title: '&6=== 附魔战争状态 ==='
  status-phase: '&7阶段: &f{phase}'
  status-queue: '&7队列人数: &f{count}'
  status-roster: '&7对局内玩家: &f{count}'
  status-alive: '&7场地内存活: &f{count}'
  status-teams: '&7队伍: &f{teams}'
  status-remaining: '&7剩余时间: &f{time}'
