name: fmwar
version: '${version}'
main: cn.mgtown.FMWar
api-version: '1.21.11'
load: POSTWORLD
description: 附魔战争 - 场地 PvP 小游戏
authors: [mgtown]
softdepend: [ExtraShop, Residence]

# 声明支持 Folia（区域化多线程）。Folia 会据此接受本插件加载；
# Paper 上该键被忽略，不影响任何行为。代码侧的 Folia 化改造见
# docs/folia-26.3-compat.md §6~§8。
folia-supported: true

commands:
  fmwar:
    description: 附魔战争管理指令
    usage: /fmwar <reload|start|stop|status|doctor>
    aliases: [fm]

permissions:
  fmwar.admin:
    description: 附魔战争管理权限（reload / start / stop / status / doctor）
    default: op
  fmwar.play:
    description: 允许点击加入游戏 / 观战按钮
    default: true
