group=cn.mgtown
version=1.0.1
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 中国境内镜像支持（build.gradle.kts 与 settings.gradle.kts 会读取以下配置）
# ---------------------------------------------------------------------------
# true  = 依赖与 Gradle 插件优先从国内镜像（阿里云 / 华为云）解析，官方仓库仅作兜底
# false = 完全使用官方仓库（mavenCentral / plugins.gradle.org / repo.papermc.io）
# 海外网络环境或排查依赖来源问题时改成 false 即可，无需改动任何构建脚本。

useChinaMirrors=true

# 镜像地址集中在此维护，更换镜像时只需改这些值。
# 阿里云公共仓库：代理 Maven Central + JCenter
chinaMirror.public=https://maven.aliyun.com/repository/public
# 阿里云 Gradle 插件仓库：代理 plugins.gradle.org（解析 run-paper 等插件）
chinaMirror.gradlePlugin=https://maven.aliyun.com/repository/gradle-plugin
# 华为云镜像：国内备用源，阿里云缺件时使用
chinaMirror.huawei=https://repo.huaweicloud.com/repository/maven/

# 可选：Gradle 发行包（wrapper）也走国内镜像时，请把
# gradle/wrapper/gradle-wrapper.properties 中的 distributionUrl 换成下面这行
# （腾讯云镜像，发行版本号按需替换）：
# distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.4.0-bin.zip
# 注意：发行包下载地址只由 gradle-wrapper.properties 控制，本文件无法生效。
